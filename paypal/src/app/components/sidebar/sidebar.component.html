<aside class="sidebar" *ngIf="(isLoggedIn$ | async) && mostrarSidebar" role="navigation" aria-label="{{ 'sidebar.main' | translate }}">

    <div class="sidebar-logo" routerLink="/" role="link" aria-label="{{ 'sidebar.goToMain' | translate }}">
        <img src="assets/logo3.webp" alt="Logo" />
    </div>

    <nav class="sidebar-nav">
        <a routerLink="/profile" routerLinkActive="active" role="link" tabindex="0">
            <span class="icon icon-user" aria-hidden="true"></span>
            {{ 'profile.title' | translate }}
        </a>

        <a routerLink="/dashboard" routerLinkActive="active" role="link" tabindex="0">
            <span class="icon icon-dashboard" aria-hidden="true"></span>
            {{ 'sidebar.dashboard' | translate }}
        </a>

        <a routerLink="/tarjetas" role="link" tabindex="0">
            <span class="icon icon-card" aria-hidden="true"></span>
            {{ 'cards.title' | translate }}
        </a>

        <a routerLink="/transactions" routerLinkActive="active" role="link" tabindex="0">
            <span class="icon icon-transfer" aria-hidden="true"></span>
            {{ 'transactions.title' | translate }}
        </a>

        <a routerLink="/movimientos" routerLinkActive="active" role="link" tabindex="0">
            <span class="icon icon-movements" aria-hidden="true"></span>
            {{ 'transactions.title' | translate }}
        </a>

        <a routerLink="/configuracion" routerLinkActive="active" role="link" tabindex="0">
            <span class="icon icon-settings" aria-hidden="true"></span>
            {{ 'settings.title' | translate }}
        </a>

        <a (click)="logout()" role="button" tabindex="0">
            <span class="icon icon-logout" aria-hidden="true"></span>
            {{ 'auth.logout' | translate }}
        </a>
    </nav>
</aside>
