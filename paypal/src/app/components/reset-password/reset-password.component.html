<div class="auth-container">
  <div class="auth-card">
    <h2>Restablecer Contraseña</h2>
    <p class="auth-subtitle">Ingresa y confirma tu nueva contraseña.</p>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="newPassword">Nueva contraseña:</label>
        <input id="newPassword" formControlName="newPassword" type="password" 
               (input)="validatePassword(resetForm.get('newPassword')?.value)" />
        
        <!-- Indicador de fortaleza de contraseña -->
        <div *ngIf="resetForm.get('newPassword')?.value" class="password-strength mt-2">
          <div class="strength-bar">
            <div class="strength-fill" [class]="'strength-' + passwordStrength"></div>
          </div>
          <small class="text-muted">
            Fortaleza: 
            <span [class]="'text-' + (passwordStrength === 'weak' ? 'danger' : passwordStrength === 'medium' ? 'warning' : 'success')">
              {{ passwordStrength === 'weak' ? 'Débil' : passwordStrength === 'medium' ? 'Media' : 'Fuerte' }}
            </span>
          </small>
        </div>

        <!-- Errores de validación -->
        <div *ngIf="passwordErrors.length > 0" class="password-errors mt-2">
          <small *ngFor="let error of passwordErrors" class="form-text text-danger d-block">
            ❌ {{ error }}
          </small>
        </div>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña:</label>
        <input id="confirmPassword" formControlName="confirmPassword" type="password" />
      </div>
      
      <div *ngIf="submitted && resetForm.errors?.['mismatch']" class="error-message">
        Las contraseñas no coinciden.
      </div>
      
      <button type="submit" class="auth-button" [disabled]="passwordErrors.length > 0">
        Restablecer contraseña
      </button>
    </form>
    <div *ngIf="message" class="success-message">{{ message }}</div>
    <div *ngIf="error" class="error-message">{{ error }}</div>
  </div>
</div>
