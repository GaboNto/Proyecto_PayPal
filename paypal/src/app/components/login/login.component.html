<div class="auth-container">
  <div class="auth-card">
    <h2>{{ 'auth.login' | translate }}</h2>
    <p class="auth-subtitle">{{ 'auth.welcomeBack' | translate }}</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'auth.email' | translate }}</label>
        <input id="email" type="email" formControlName="email" />
      </div>
      <div class="form-group">
        <label for="password">{{ 'auth.password' | translate }}</label>
        <input id="password" type="password" formControlName="password" />
      </div>
      <button type="submit" class="auth-button" [disabled]="!loginForm.valid || isLoading">
        <span *ngIf="!isLoading">{{ 'auth.login' | translate }}</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

    </form>
    <div *ngIf="error" class="error-message">{{ error }}</div>
    <p class="auth-link">
      <a routerLink="/forgot-password">{{ 'auth.forgotPassword' | translate }}</a>
    </p>
    <p class="auth-link">
      {{ 'auth.dontHaveAccount' | translate }} <a routerLink="/register">{{ 'auth.signUp' | translate }}</a>
    </p>
  </div>
</div>
